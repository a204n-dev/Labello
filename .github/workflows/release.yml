name: Build and Release Windows Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows .exe Release (Bun Runtime)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun (Fast & User-Friendly All-in-One Toolkit)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Bun Environment
        shell: pwsh
        run: |
          Write-Host "Bun Version: $(bun --version)"

      - name: Install Dependencies
        run: bun install

      - name: Build Web Application
        run: bun run build

      - name: Package Windows Installer & Portable Executable
        run: bunx electron-builder --win --x64 -p never --config electron-builder.json
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Generate SHA-256 Checksums & Release Notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          $exeFiles = Get-ChildItem -Path release -Filter *.exe
          if ($exeFiles.Count -gt 0) {
            $exeFiles | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath release/checksums-sha256.txt -Append -Encoding ascii
            }
            Get-Content release/checksums-sha256.txt
          } else {
            Write-Warning "No .exe files found in release directory."
          }

          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }

          $notes = @"
          ## Labello - Vocal Labeling Workstation ($tag)
          *Built on top of [vLabeler](https://github.com/sdercolin/vlabeler) by @sdercolin*
          *Built with Bun - high performance, modern runtime & package manager*

          ### Windows Downloads:
          - **Installer (.exe)**: Setup wizard with desktop and start menu shortcuts.
          - **Portable (.exe)**: Standalone executable, runs immediately with zero installation.

          ### Verification:
          Refer to `checksums-sha256.txt` attached to this release.

          ### Requirements:
          - Windows 10 / Windows 11 (64-bit)
          - 4 GB+ RAM
          "@
          $notes | Out-File -FilePath release/release-notes.md -Encoding utf8

      - name: Upload Windows Executables as Action Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            release/*.exe
            release/checksums-sha256.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }

          Write-Host "Publishing release for tag: $tag"

          $exeFiles = Get-ChildItem -Path release -Filter *.exe
          if ($exeFiles.Count -eq 0) {
            Write-Error "No executables found in release directory to publish."
            exit 1
          }

          $fileArgs = @()
          $exeFiles | ForEach-Object { $fileArgs += $_.FullName }
          if (Test-Path release/checksums-sha256.txt) {
            $fileArgs += (Resolve-Path release/checksums-sha256.txt).Path
          }

          $releaseExists = $false
          try {
            gh release view $tag
            $releaseExists = $true
          } catch {
            $releaseExists = $false
          }

          try {
            if ($releaseExists) {
              Write-Host "Release $tag exists. Uploading assets..."
              gh release upload $tag @fileArgs --clobber
            } else {
              Write-Host "Creating new release $tag..."
              gh release create $tag @fileArgs --title "Labello $tag" --notes-file release/release-notes.md
            }
            Write-Host "Release successfully published to GitHub Releases!"
          } catch {
            Write-Warning "Could not publish directly to GitHub Releases: $_"
            Write-Warning "Ensure repository settings have: Settings -> Actions -> General -> Workflow permissions set to 'Read and write permissions'."
            Write-Warning "The executables have been safely preserved in the Action Artifacts section."
          }
