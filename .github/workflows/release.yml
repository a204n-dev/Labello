name: Build and Release Windows Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows .exe Release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NPM_CONFIG_OPTIONAL: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies (no optional deps)
        run: npm ci --no-optional --prefer-offline

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Installer & Portable Executable
        run: npx electron-builder --win nsis portable --config electron-builder.json -p never
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Generate SHA-256 Checksums & Release Notes
        shell: pwsh
        run: |
          $releaseDir = "release"
          if (-not (Test-Path $releaseDir)) {
            Write-Warning "Release directory not found at $releaseDir"
            exit 1
          }
          $exes = Get-ChildItem -Path $releaseDir -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Error "No .exe files found in $releaseDir"
            exit 1
          }
          $exes | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$releaseDir/checksums-sha256.txt" -Append -Encoding ascii
          }
          Get-Content "$releaseDir/checksums-sha256.txt"

          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }

          $notes = @"
          ## Labello - Vocal Labeling Workstation ($tag)
          *Built on top of [vLabeler](https://github.com/sdercolin/vlabeler) by @sdercolin*

          ### Windows Downloads:
          - **Installer (.exe)**: Setup wizard with desktop and start menu shortcuts.
          - **Portable (.exe)**: Standalone executable, runs immediately with zero installation.

          ### Verification:
          Refer to \`checksums-sha256.txt\` attached to this release.

          ### Requirements:
          - Windows 10 / Windows 11 (64-bit)
          - 4 GB+ RAM
          "@
          $notes | Out-File -FilePath "$releaseDir/release-notes.md" -Encoding utf8

      - name: Upload Windows Executables as Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            release/*.exe
            release/checksums-sha256.txt
          retention-days: 30

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }

          Write-Host "Publishing release for tag: $tag"

          $releaseExists = $false
          try {
            gh release view $tag
            $releaseExists = $true
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            Write-Host "Release $tag exists. Uploading assets..."
            gh release upload $tag release/*.exe release/checksums-sha256.txt --clobber
          } else {
            Write-Host "Creating new release $tag..."
            gh release create $tag release/*.exe release/checksums-sha256.txt --title "Labello $tag" --notes-file release/release-notes.md
          }