name: Build Native Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > checksums-sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labello-windows-desktop
          path: |
            release/*.exe
            release/checksums-sha256.txt
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          NOTES="Labello desktop release for Windows. Download the installer or portable executable and launch it directly; a browser is not required."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe release/checksums-sha256.txt --clobber
          else
            gh release create "$TAG" release/*.exe release/checksums-sha256.txt \
              --title "Labello $TAG — Native Desktop App" \
              --notes "$NOTES"
          fi
