name: Build Native Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        default: 'v0.1.0-beta.1'
      prerelease:
        description: 'Publish as a beta / prerelease'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set app version from release tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe > checksums-sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labello-windows-desktop
          path: |
            release/*.exe
            release/checksums-sha256.txt
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            PRERELEASE="$MANUAL_PRERELEASE"
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_TITLE="Labello $TAG — Beta Test"
            NOTES="Beta test build of Labello for Windows. This is an early release; review project saves and exported voicebank or dataset files before using them as production data. Download the installer or portable executable and launch it directly; a browser is not required."
          else
            RELEASE_TITLE="Labello $TAG — Native Desktop App"
            NOTES="Labello desktop release for Windows. Download the installer or portable executable and launch it directly; a browser is not required."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe release/*.blockmap release/latest.yml release/checksums-sha256.txt --clobber
          else
            RELEASE_ARGS=(
              "$TAG"
              release/*.exe
              release/*.blockmap
              release/latest.yml
              release/checksums-sha256.txt
              --title "$RELEASE_TITLE"
              --notes "$NOTES"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_ARGS[@]}"
          fi
